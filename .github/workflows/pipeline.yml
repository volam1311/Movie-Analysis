name: pipeline

# Full ELT run: TMDB -> bronze -> DuckDB -> dbt build (tests) -> Databricks gold.
on:
  schedule:
    # GitHub can delay or drop scheduled runs, especially at :00, so the main
    # slot sits off the hour and a second slot retries a few hours later.
    # Sunday 20:17 UTC = Monday 06:17 UTC+10 (main run).
    - cron: "17 20 * * 0"
    # Sunday 23:17 UTC = Monday 09:17 UTC+10 (fallback; skipped by the guard
    # job if a run already succeeded in the last 20 hours).
    - cron: "17 23 * * 0"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish gold tables to Databricks"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read  # guard job lists earlier runs of this workflow

# Never run two pipelines at once; a second trigger waits for the first.
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  # Scheduled runs only: skip if this workflow already succeeded recently, so
  # the fallback cron does not repeat a run that the main cron completed.
  # Manual runs always go ahead.
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          since=$(date -u -d '-20 hours' +%Y-%m-%dT%H:%M:%SZ)
          count=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pipeline.yml \
            --status success --created ">=$since" --json databaseId --jq 'length')
          echo "Successful runs since $since: $count"
          if [ "$count" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  run:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180  # ~10k detail calls at 0.25s spacing take about an hour
    env:
      READACCESS_TOKEN: ${{ secrets.READACCESS_TOKEN }}
      DATABRICKS_SERVER_HOSTNAME: ${{ secrets.DATABRICKS_SERVER_HOSTNAME }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_CATALOG: ${{ secrets.DATABRICKS_CATALOG }}
      DATABRICKS_SCHEMA: ${{ secrets.DATABRICKS_SCHEMA }}
      # Scheduled runs have no inputs, so they publish by default.
      SKIP_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: movie-pipeline:run
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run pipeline
        # `-e NAME` with no value passes the variable through from the job env,
        # so secret values never appear on the command line.
        run: |
          docker run --name pipeline \
            -e READACCESS_TOKEN \
            -e DATABRICKS_SERVER_HOSTNAME \
            -e DATABRICKS_HTTP_PATH \
            -e DATABRICKS_TOKEN \
            -e DATABRICKS_CATALOG \
            -e DATABRICKS_SCHEMA \
            -e SKIP_PUBLISH \
            movie-pipeline:run

      - name: Copy outputs out of the container
        if: always()
        run: |
          mkdir -p out
          docker cp pipeline:/app/logs out/logs || true
          docker cp pipeline:/app/data/bronze out/bronze || true
          docker cp pipeline:/app/movie_dbt/target/run_results.json out/dbt_run_results.json || true
          docker cp pipeline:/app/movie_dbt/logs/dbt.log out/dbt.log || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_number }}
          path: |
            out/logs
            out/dbt_run_results.json
            out/dbt.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload bronze snapshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bronze-${{ github.run_number }}
          path: out/bronze
          retention-days: 90
