name: ci

# Fast checks on every push / PR. No secrets, no TMDB calls, no Databricks writes.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: movie-pipeline:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Python compiles
        run: docker run --rm movie-pipeline:ci python -m compileall -q src

      - name: Pipeline script syntax
        run: docker run --rm movie-pipeline:ci bash -n scripts/run_pipeline.sh

      - name: dbt parse (models, tests, YAML)
        run: docker run --rm -w /app/movie_dbt movie-pipeline:ci dbt parse --profiles-dir .
